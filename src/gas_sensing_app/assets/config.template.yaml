# Master Configuration Template for Gas Sensing Dashboard
# Copy this file to the root directory as 'config.yaml' to modify live settings.

hardware:
  use_mock: true # Set to false to connect to actual instruments

  keithley_2400:
    port: "COM3" # Update with actual system COM port (e.g., COM3 or /dev/ttyUSB0)
    auto_range: false
    manual_range: 200000
    four_wire: true

  keithley_2700:
    port: "GPIB0::16::INSTR"
    baud_rate: 9600 # RS-232 only; match front panel (factory default is 4800)
    read_termination: "\r" # RS-232 Tx TERM: CR; FLOW: NONE

  shutter:
    port: "COM4" # Update with actual system COM port
    baud_rate: 115200
    open_angle: 90 # Physical servo open angle calibration
    closed_angle: 0 # Physical servo closed angle calibration

  mfc_controller:
    port: "COM5" # Update with actual system COM port
    gas_names: {1: not_connected, 2: reference, 3: analyte, 4: not_connected}
    range_sccm:
      1: 1000 # Maximum limits per MFC channel
      2: 1000
      3: 200
      4: 200

logging:
  data_log:
    folder: "data"
    filename_prefix: "gas_experiment"

  console_log:
    enabled: true
    folder: "console_logs"
    filename_prefix: "system_console"


measurement:
  instrument: "2400" # 2400 single sensor, 2700 + 7706 multiple sensors
  mode: constant_voltage # 2400: fixed voltage with R/V/I; 2700: resistance/voltage
  wire_mode: 2
  slot: 1
  first_channel: 1
  last_channel: 1 # 1–20 for 2-wire, 1–10 for 4-wire (paired with n+10)
  interval_s: 1.0
  bias_voltage: 1.0 # Applied voltage (V); used in constant_voltage mode
  compliance: 0.01 # Current limit (A)
  auto_range: true
  manual_range: 200000.0 # Ohms; used only when auto_range is false

gate:
  enabled: false
  mode: fixed # fixed or sweep
  voltage: 0.0
  start: 0.0
  stop: 1.0
  step: 0.1 # Positive increment; descending sweeps are supported
  dwell_s: 1.0 # Settling time before acquisition at each point
  current_limit: 0.001
  max_voltage: 65.0

safety_file: failure_gases.yaml
