# Master Configuration Template for Gas Sensing Dashboard
# Installed automatically as workspace/settings/config.yaml on first startup.
# Relative output folders are resolved from the workspace root.

hardware:
  use_mock: true # Set to false to connect to actual instruments

  keithley_2400:
    port: "" # Choose the local address with Devices in the top panel
    auto_range: false
    manual_range: 200000
    four_wire: true

  keithley_2700:
    port: "" # Choose the local address with Devices
    baud_rate: 9600 # RS-232 only; match front panel (factory default is 4800)
    read_termination: "\r" # RS-232 Tx TERM: CR; FLOW: NONE

  shutter:
    port: "" # Optional shutter serial port; configured in Devices
    baud_rate: 115200
    open_angle: 90 # Physical servo open angle calibration
    closed_angle: 0 # Physical servo closed angle calibration

  mfc_controller:
    port: "" # MFC VISA address; configured in Devices
    gas_names: {1: not_connected, 2: reference, 3: analyte, 4: not_connected}
    range_sccm:
      1: 1000 # Maximum limits per MFC channel
      2: 1000
      3: 200
      4: 200

logging:
  data_log:
    folder: "data"
    filename_prefix: "gas_experiment"

  console_log:
    enabled: true
    folder: "console_logs"
    filename_prefix: "system_console"


measurement:
  instrument: "2400" # 2400 single sensor, 2700 + 7706 multiple sensors
  mode: constant_voltage # 2400: resistance/constant_voltage/constant_current; 2700: resistance/voltage
  wire_mode: 2
  slot: 1
  first_channel: 1
  last_channel: 1 # 1–20 for 2-wire, 1–10 for 4-wire (paired with n+10)
  interval_s: 1.0
  bias_voltage: 1.0 # Applied voltage (V); used in constant_voltage mode
  compliance: 0.01 # Current limit (A)
  auto_range: true
  manual_range: 200000.0 # Ohms; automatic-ohms mode only on 2400
  source_current: 0.0000005 # A; UI displays µA (0.5 µA)
  voltage_compliance: 2.0 # V; limit for constant-current sourcing
  source_auto_range: true
  source_voltage_range: 20.0 # V
  source_current_range: 0.000001 # A
  voltage_auto_range: true
  voltage_range: 20.0 # V; opposite-quantity sense range on 2400
  current_auto_range: true
  current_range: 0.000001 # A; opposite-quantity sense range on 2400
  pulsed: false # 2400 only; interval_s becomes minimum off-to-on time
  settling_s: 0.01 # 2400 source delay; on-time also includes acquisition
  nplc: 1.0 # Integration: 2400 0.01–10; 2700 0.01–50

gate:
  enabled: false
  mode: fixed # fixed or sweep
  voltage: 0.0
  start: 0.0
  stop: 1.0
  step: 0.1 # Positive increment; descending sweeps are supported
  dwell_s: 1.0 # Settling time before acquisition at each point
  current_limit: 0.001
  max_voltage: 65.0

safety_file: failure_gases.yaml
