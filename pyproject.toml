[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gas_sensing_app"
version = "0.1.0"
description = "A modular multi-threaded GUI application for laboratory gas sensing and instrument control"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Thomas Fischer", email = "t.fischer@uni-koeln.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Core external dependencies used across your core/gui/hardware modules
dependencies = [
    "PyQt6>=6.4.0",
    "PyYAML>=6.0",
    "pyqtgraph>=0.13.0",
    "pyvisa",
    "pyserial",
    "pymeasure",
    "pyvisa-py",
    "zeroconf",
    "psutil",
]

# This registers the application so you can run it globally via terminal command
[project.scripts]
sensor = "gas_sensing_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gas_sensing_app = ["assets/**/*"]
